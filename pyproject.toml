[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "it-support-copilot"
version = "0.1.0"
description = "Private-first Agentic RAG IT Support Copilot (local demo)"
requires-python = ">=3.11"
# Dependencies live in requirements.txt; `pip install -e .` only makes `copilot` importable.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = [
    "integration: needs real API keys / network (deselect with -m 'not integration')",
    "retrieval: loads the real embedding model; skipped unless --run-retrieval or --update-retrieval-baseline is given",
]
addopts = "-ra"

[tool.ruff]
line-length = 200            # the code base uses long readable lines; line length is not enforced (E501 is not selected)
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]   # import placement, statement style, syntax errors, pyflakes (unused imports/variables, undefined names)

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]           # re-exports

[tool.coverage.run]
source = ["src/copilot"]

[tool.coverage.report]
show_missing = true
skip_empty = true
