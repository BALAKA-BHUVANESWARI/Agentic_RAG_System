# IT Support Copilot, local Docker environment (no deployment).
#
#   cp .env.example .env            # then fill in GROQ_API_KEY, PINECONE_API_KEY, TAVILY_API_KEY
#   docker compose build
#   docker compose up               # API on http://127.0.0.1:8000/docs, UI on http://127.0.0.1:8501
#
# One-off tools share the same image and volumes (profile "tools"):
#   docker compose run --rm ingest
#   docker compose run --rm eval --per-category 1 --no-judge
#   docker compose run --rm tests
#
# Keys come from .env at run time and are never baked into the image.
# Ports are published on 127.0.0.1 only: the demo authentication (X-Demo-Role header) is NOT real security.

name: it-support-copilot

x-app: &app
  image: it-support-copilot:local
  build:
    context: .
    args:
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
  env_file: .env
  environment: &app-env
    # Container values win over .env, which holds host-style values (127.0.0.1, relative paths).
    API_HOST: 0.0.0.0
    API_PORT: "8000"
    API_BASE_URL: http://api:8000
    SQLITE_PATH: /app/data/sqlite/app.db
    KB_DOCUMENTS_DIR: /app/data/kb_documents
    EVAL_DIR: /app/data/eval
    UPLOADS_DIR: /app/data/uploads
    # The embedding model is baked into the image; no hub calls at start-up.
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
  volumes: &app-volumes
    - copilot-sqlite:/app/data/sqlite
    - copilot-uploads:/app/data/uploads
    - copilot-eval-results:/app/data/eval/results

services:
  api:
    <<: *app
    command: ["python", "scripts/run_api.py"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      # Liveness only: /health answers 200 even when a dependency is degraded (it lists which one).
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 90s   # loading the embedding model takes a while

  ui:
    <<: *app
    command:
      - streamlit
      - run
      - frontend/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports:
      - "127.0.0.1:${UI_HOST_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s

  # ---- one-off tools (docker compose run --rm <name> ...) ---------------------------------------
  ingest:
    <<: *app
    profiles: ["tools"]
    entrypoint: ["python", "scripts/ingest_kb.py"]
    restart: "no"

  eval:
    <<: *app
    profiles: ["tools"]
    entrypoint: ["python", "scripts/run_eval.py"]
    command: ["--validate-only"]
    restart: "no"

  tests:
    <<: *app
    profiles: ["tools"]
    entrypoint: ["python", "-m", "pytest"]
    command: ["tests/unit", "-q"]
    restart: "no"

volumes:
  copilot-sqlite:
  copilot-uploads:
  copilot-eval-results:
